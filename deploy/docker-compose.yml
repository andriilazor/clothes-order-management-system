# Local environment. Run from the repository root:
#   docker compose -f deploy/docker-compose.yml up
# Settings come from environment variables; defaults are for local development only.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coms_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d customers_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
