[project]
name = "customers"
version = "0.0.0"
description = "Customers service: registration, login, tokens, profiles, addresses"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
