[project]
name = "payments"
version = "0.0.0"
description = "Payments service: payment authorisation and capture"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
