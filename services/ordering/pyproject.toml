[project]
name = "ordering"
version = "0.0.0"
description = "Ordering service: cart, order, shipment"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
