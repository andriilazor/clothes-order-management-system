# Migrations of the Ordering database.
# Run from the repository root, with ORDERING_DATABASE_URL set:
#   uv run alembic -c services/ordering/alembic.ini upgrade head
[alembic]
script_location = %(here)s/src/ordering/adapters/outbound/sql/migrations
file_template = rev_%%(rev)s_%%(slug)s
prepend_sys_path = .
